    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  .scene {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 44px 32px 40px;
    text-align: center;
    box-shadow: 0 24px 60px -20px var(--shadow-tint), 0 2px 0 rgba(255, 255, 255, 0.8) inset;
    backdrop-filter: blur(6px);
    animation: settle 0.6s cubic-bezier(.2, .9, .3, 1.2);
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card h1 {
    margin: 0 0 10px;
    font-size: clamp(1.9rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  .card p.sub {
    margin: 0 0 30px;
    font-size: 0.98rem;
    color: var(--muted);
    text-wrap: balance;
    line-height: 1.5;
  }

  .actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 1.05rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .btn:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 3px;
  }

  .btn-yes {
    background: var(--accent-yes);

<div class="scene">
  <div class="card">
    <h1>Oiii gatinha, vamos ter um date?</h1>
    <div class="actions">
      <button id="yesBtn" class="btn btn-yes" type="button">Sim!</button>
      <button id="noBtn" class="btn btn-no" type="button">Não</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="planModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Vamooosss!!</h2>
    <p class="modal-sub">Escolhe o melhor dia pra você, estou sempre a sua diposição.</p>
    <form id="planForm">
      <div class="field">
        <label for="planDate">Data</label>
        <input type="date" id="planDate" name="planDate" required>
      </div>
      <div class="field">
        <label for="planActivity">O que vamos fazer</label>
        <select id="planActivity" name="planActivity" required>
          <option value="" disabled selected>Escolha uma opção</option>
          <option value="Sushi">Sushi</option>
          <option value="Assistir filme">Assistir filme</option>
          <option value="Shopping">Shopping</option>
          <option value="Sinuca">Sinuca</option>
          <option value="Encher a cara">Encher a cara</option>
          <option value="Falar mal dos outros">Falar mal dos outros</option>
          <option value="Dormir 12h">Dormir 12h</option>
          <option value="Assaltar um banco (apenas de brincadeira)">Assaltar um banco</option>
          <option value="Comer lanche">Comer lanche</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn btn-ghost">Cancelar</button>
        <button type="submit" class="btn btn-yes">Confirmar</button>
      </div>
    </form>
  </div>
</div>

<div class="celebration" id="celebration" hidden>
  <canvas id="confetti"></canvas>
  <div class="celebration-card">
    <h2>Obaaaaaaaa! 🎉</h2>
    <p id="celebrationText">Agora é só aparecer.</p>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var noBtn = document.getElementById("noBtn");
    var yesBtn = document.getElementById("yesBtn");
    var card = document.querySelector(".card");

    function viewportSize() {
      return {
        w: document.documentElement.clientWidth,
        h: document.documentElement.clientHeight
      };
    }

    function rectsOverlap(a, b, margin) {
      return !(
        a.right + margin < b.left ||
        a.left - margin > b.right ||
        a.bottom + margin < b.top ||
        a.top - margin > b.bottom
      );
    }

    function dodge() {
      var btnRect = noBtn.getBoundingClientRect();
      var w = btnRect.width || 90;
      var h = btnRect.height || 48;
      var pad = 12;
      var viewport = viewportSize();
      var maxX = Math.max(pad, viewport.w - w - pad);
      var maxY = Math.max(pad, viewport.h - h - pad);
      var cardRect = card.getBoundingClientRect();

      if (!noBtn.classList.contains("escaped")) {
        document.body.appendChild(noBtn);
        noBtn.classList.add("escaped");
        noBtn.style.left = btnRect.left + "px";
        noBtn.style.top = btnRect.top + "px";
      }

      var target = null;
      for (var i = 0; i < 12; i++) {
        var x = pad + Math.random() * (maxX - pad);
        var y = pad + Math.random() * (maxY - pad);
        var candidate = { left: x, top: y, right: x + w, bottom: y + h };
        if (!rectsOverlap(candidate, cardRect, 16)) {
          target = candidate;
          break;
        }
        target = candidate;
      }

      noBtn.style.left = target.left + "px";
      noBtn.style.top = target.top + "px";
    }

    noBtn.addEventListener("pointerenter", function (e) {
      if (e.pointerType === "mouse") dodge();
    });
    noBtn.addEventListener("pointerdown", function () {
      dodge();
    });

    window.addEventListener("resize", function () {
      if (!noBtn.classList.contains("escaped")) return;
      var w = noBtn.offsetWidth;
      var h = noBtn.offsetHeight;
      var viewport = viewportSize();
      var maxX = Math.max(12, viewport.w - w - 12);
      var maxY = Math.max(12, viewport.h - h - 12);
      var curLeft = parseFloat(noBtn.style.left) || 0;
      var curTop = parseFloat(noBtn.style.top) || 0;
      noBtn.style.left = Math.min(curLeft, maxX) + "px";
      noBtn.style.top = Math.min(curTop, maxY) + "px";
    });

    var planModal = document.getElementById("planModal");
    var planForm = document.getElementById("planForm");
    var planDate = document.getElementById("planDate");
    var planActivity = document.getElementById("planActivity");
    var cancelBtn = document.getElementById("cancelBtn");
    var celebrationText = document.getElementById("celebrationText");

    function pad2(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    var today = new Date();
    planDate.min = today.getFullYear() + "-" + pad2(today.getMonth() + 1) + "-" + pad2(today.getDate());

    function formatDate(iso) {
      var parts = iso.split("-");
      return parts[2] + "/" + parts[1] + "/" + parts[0];
    }

    function openModal() {
      planModal.hidden = false;
      planDate.focus();
    }

    function closeModal() {
      planModal.hidden = true;
      yesBtn.focus();
    }

    cancelBtn.addEventListener("click", closeModal);

    planModal.addEventListener("click", function (e) {
      if (e.target === planModal) closeModal();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !planModal.hidden) closeModal();
    });

    var NOTIFY_EMAIL = "biel40albuquerque@gmail.com";

    function notifySilently(formattedDate, activity) {
      var body = {
        _subject: "Ela disse SIM! 🎉",
        _template: "table",
        _captcha: "false",
        Data: formattedDate,
        Atividade: activity
      };
      fetch("https://formsubmit.co/ajax/" + NOTIFY_EMAIL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json();
      }).then(function (json) {
        var ok = json && (json.success === true || json.success === "true");
        if (!ok) throw new Error("formsubmit failed: " + (json && json.message));
      }).catch(function () {
        var subject = encodeURIComponent("Ela disse SIM! 🎉");
        var text = encodeURIComponent("Data: " + formattedDate + "\nAtividade: " + activity);
        window.location.href = "mailto:" + NOTIFY_EMAIL + "?subject=" + subject + "&body=" + text;
      });
    }

    planForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!planDate.value || !planActivity.value) return;
      var formattedDate = formatDate(planDate.value);
      var activity = planActivity.value;
      celebrationText.textContent = "📅 " + formattedDate + " — " + activity;
      planModal.hidden = true;
      celebration.hidden = false;
      if (!reduceMotion) {
        launchConfetti();
      }
      notifySilently(formattedDate, activity);
    });

    var celebration = document.getElementById("celebration");
    var canvas = document.getElementById("confetti");
    var ctx = canvas.getContext("2d");
    var confettiRunning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    var palette = ["#ff6f91", "#ffb26b", "#ffd166", "#8fe3c8", "#c8b6f0"];

    function launchConfetti() {
      resizeCanvas();
      var pieces = [];
      var count = 140;
      for (var i = 0; i < count; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.5,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 10,
          color: palette[Math.floor(Math.random() * palette.length)],
          speedY: 2 + Math.random() * 3,
          speedX: (Math.random() - 0.5) * 2,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random() - 0.5) * 0.2
        });
      }

      var start = null;
      var duration = 3200;
      confettiRunning = true;

      function frame(ts) {
        if (start === null) start = ts;
        var elapsed = ts - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(function (p) {
          p.x += p.speedX;
          p.y += p.speedY;
          p.rot += p.rotSpeed;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (elapsed < duration && confettiRunning) {
          requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          confettiRunning = false;
        }
      }
      requestAnimationFrame(frame);
    }

    yesBtn.addEventListener("click", openModal);
  })();
</script>
